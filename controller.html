<!DOCTYPE html>
<html>
<head>
  <title>ESP8266 Robot Controller</title>
  <script>
    const password = prompt("Enter password to access the controller:");
    if (password !== "tsnottuff") {
      alert("Access denied!");
      document.write("You are not authorized to view this page.");
      throw new Error("Unauthorized access");
    }
  </script>
</head>
<body style="text-align:center; font-family:sans-serif;">
  <h2>MQTT Car Control</h2>
  <p>Status: <span id="status">Connecting...</span></p>
  <h3 id="modeStatus">Current Mode: Manual</h3>
  <button onclick="send('W')">W (Forward)</button><br><br>
  <button onclick="send('A')">A (Right)</button>
  <button onclick="send('D')">D (Left)</button><br><br>
  <button onclick="send('S')">S (Backward)</button><br><br>
  <button onclick="send('O')">O (Stop)</button><br><br>
  <button onclick="switchMode('AUTO')">Auto Mode</button>
  <button onclick="switchMode('MANUAL')">Manual Mode</button>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script>

    const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");
    const topic = "mycar/control";
    let currentMode = 'MANUAL';

    client.on("connect", () => {
      document.getElementById("status").innerText = "Connected to MQTT";
    });

    client.on("error", (err) => {
      document.getElementById("status").innerText = "MQTT Error";
      console.error(err);
    });

    function send(cmd) {
      client.publish(topic, cmd);
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById("modeStatus").innerText = `Current Mode: ${mode}`;
      send(mode);  // Send the mode command
    }

    document.addEventListener('keydown', function(e) {
      const key = e.key.toLowerCase();
      if (currentMode === 'MANUAL') {
        if (key === 'w') send('W');
        else if (key === 's') send('S');
        else if (key === 'a') send('A');
        else if (key === 'd') send('D');
        else if (key === 'o') send('O');
      }
    });
  </script>
</body>
</html>
